plugins { id 'com.android.application' }
android {
    namespace 'cn.yuanjk.shuzi'
    compileSdk 34
    defaultConfig {
        applicationId "cn.yuanjk.shuzi"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
